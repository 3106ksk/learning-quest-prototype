<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>タイマー</title><link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="stylesheet" href="./components.css"></head><body>
<main class="timer-page"><div class="timer-panel"><section class="timer-running" id="running" aria-labelledby="timer-goal"><p class="small" id="timer-goal">TOEIC 800点を目指す</p><p class="timer-status" id="timer-status" aria-live="polite"></p><p class="timer-display" id="timer-display" role="timer" aria-label="残り時間 1分00秒">1:00</p><div class="timer-track" aria-hidden="true"><div class="timer-remaining" id="timer-remaining"></div></div><div class="button-row timer-actions"><button class="btn btn-secondary" id="pause" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;margin-right:6px"><path d="M9 5v14M15 5v14"/></svg>一時停止</button><button class="btn btn-text" id="finish" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px;margin-right:6px"><rect x="6.5" y="6.5" width="11" height="11"/></svg>学習を終了</button></div><p class="caption" style="margin-top:var(--space-4)">通知音 オン</p></section><section class="timer-prompt" id="prompt" hidden aria-labelledby="prompt-title"><h1 id="prompt-title">設定した時間が終了しました</h1><p style="margin-top:var(--space-4)">英単語を10個復習</p><div class="button-row timer-actions"><a class="btn btn-primary" href="./evaluate.html">学習を終えて振り返る</a><button class="btn btn-secondary" id="extend" type="button">あと5分続ける</button></div></section></div></main>
<script>(()=>{const initial=60;let remaining=initial;let total=initial;let paused=false;let interval;const display=document.getElementById("timer-display");const line=document.getElementById("timer-remaining");const status=document.getElementById("timer-status");const pause=document.getElementById("pause");const running=document.getElementById("running");const prompt=document.getElementById("prompt");const format=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;const render=()=>{display.textContent=format(remaining);display.setAttribute("aria-label",`残り時間 ${Math.floor(remaining/60)}分${remaining%60}秒`);line.style.width=`${Math.max(0,remaining/total*100)}%`;};const stop=()=>{clearInterval(interval);running.hidden=true;prompt.hidden=false;};const start=()=>{clearInterval(interval);interval=setInterval(()=>{if(paused)return;remaining-=1;render();if(remaining<=0)stop();},1000);};pause.addEventListener("click",()=>{paused=!paused;status.textContent=paused?"一時停止中":"";pause.textContent=paused?"再開":"一時停止";});document.getElementById("finish").addEventListener("click",()=>{if(window.confirm("学習を終了しますか？"))stop();});document.getElementById("extend").addEventListener("click",()=>{remaining+=300;total=remaining;paused=false;status.textContent="";pause.textContent="一時停止";prompt.hidden=true;running.hidden=false;render();start();});render();start();})();</script>
</body></html>
