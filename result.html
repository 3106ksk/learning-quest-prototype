<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>評価結果</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./components.css">
</head>
<body>
  <main class="page">
    <div class="document-grid">
      <div class="main-column">
        <header>
          <h1>英単語を10個復習</h1>
        </header>

        <div class="stamp-stage section">
          <span class="stamp stamp-b" role="img" aria-label="Rank B">
            <svg viewBox="0 0 96 96" aria-hidden="true">
              <circle cx="48" cy="48" r="45" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="48" cy="48" r="42" fill="none" stroke="currentColor" stroke-width="0.75"/>
              <text x="48" y="55" fill="currentColor" font-size="43" font-weight="600" text-anchor="middle">B</text>
              <text class="stamp-rank-word" x="48" y="71" fill="currentColor" font-size="7" letter-spacing="1.4" text-anchor="middle">RANK</text>
            </svg>
          </span>
        </div>

        <section class="section" aria-labelledby="session-title">
          <h2 class="section-title" id="session-title">今回の学習</h2>
          <dl class="definition-list">
            <div class="definition-row">
              <dt>開始日時</dt>
              <dd><time datetime="2026-07-05T20:10">7/5 20:10</time></dd>
            </div>
            <div class="definition-row">
              <dt>予定時間</dt>
              <dd class="num">15分</dd>
            </div>
            <div class="definition-row">
              <dt>実時間</dt>
              <dd class="num">13分</dd>
            </div>
          </dl>
        </section>

        <section class="section" aria-labelledby="effort-title">
          <h2 class="section-title" id="effort-title">今回の努力の記録</h2>
          <dl class="definition-list evaluation-breakdown">
            <div class="definition-row">
              <dt>着手</dt>
              <dd>学習を開始できた</dd>
            </div>
            <div class="definition-row">
              <dt>集中</dt>
              <dd>
                <p><strong>集中して取り組めた</strong></p>
                <p class="small">学習内容に向き合って進められた</p>
              </dd>
            </div>
            <div class="definition-row">
              <dt>チャレンジ</dt>
              <dd>
                <p><strong>自分で決めた内容に取り組めた</strong></p>
                <p class="small">決めたことをひと通り進められた</p>
              </dd>
            </div>
          </dl>
          <p class="small" style="margin-top: var(--space-4)">学習を開始したことに加え、今回記録された集中またはチャレンジの内容からRank Bになりました。</p>
        </section>

        <div class="button-row" style="margin-top: var(--space-7)">
          <a class="btn btn-primary" href="./history.html">学習の記録を見る</a>
          <a class="btn btn-secondary" href="./study.html">もう一度学習する</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
