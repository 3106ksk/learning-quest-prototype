<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>今回の学習を振り返る</title><link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="stylesheet" href="./components.css"></head><body>
<main class="page"><div class="document-grid"><div class="main-column"><header><h1>タイマー完了</h1><p style="margin-top:var(--space-2)"><span class="num">15</span>分 / 英単語を10個復習</p><p class="margin-note"><span class="num">15</span>分 / 実際<span class="num">13</span>分</p></header><section class="section" style="margin-top:var(--space-5)" aria-labelledby="evaluation-title"><div class="ledger-row"><div><h2 id="evaluation-title">今回の学習を振り返ってください</h2><p class="small" style="margin-top:var(--space-2)">実感に近いものを1つずつ選んでください。</p><p class="caption" style="margin-top:var(--space-2)">この振り返りは、ふみが読む記録になります。</p></div><a href="./evaluation-help.html">評価の仕組み</a></div><section style="margin-top:var(--space-6)" aria-labelledby="start-title"><h3 id="start-title">着手</h3><p style="margin-top:var(--space-2)">学習を開始したことは自動で記録されています。 <span class="caption">自動記録</span></p></section>
<form id="evaluation-form" novalidate><div class="eval-columns"><fieldset><legend><h3>集中</h3></legend><p class="group-error" id="focus-error" hidden>1つ選んでください</p><div class="choice-list"><input class="choice-input" type="radio" name="focus" id="focus-1" value="above"><label class="choice-row" for="focus-1"><span class="choice-mark" aria-hidden="true"></span><span><strong>いつも以上に集中できた</strong><br><span class="small">選んだ時間を高い集中状態で使えた</span></span></label><input class="choice-input" type="radio" name="focus" id="focus-2" value="steady"><label class="choice-row" for="focus-2"><span class="choice-mark" aria-hidden="true"></span><span><strong>集中して取り組めた</strong><br><span class="small">学習内容に向き合って進められた</span></span></label><input class="choice-input" type="radio" name="focus" id="focus-3" value="returned"><label class="choice-row" for="focus-3"><span class="choice-mark" aria-hidden="true"></span><span><strong>途中で集中が切れたが取り組めた</strong><br><span class="small">途切れても学習へ戻れた</span></span></label></div></fieldset>
<fieldset><legend><h3>チャレンジ</h3></legend><p class="group-error" id="challenge-error" hidden>1つ選んでください</p><div class="choice-list"><input class="choice-input" type="radio" name="challenge" id="challenge-1" value="above"><label class="choice-row" for="challenge-1"><span class="choice-mark" aria-hidden="true"></span><span><strong>決めた内容を超えて進められた</strong><br><span class="small">想定より多く取り組めた</span></span></label><input class="choice-input" type="radio" name="challenge" id="challenge-2" value="achieved"><label class="choice-row" for="challenge-2"><span class="choice-mark" aria-hidden="true"></span><span><strong>自分で決めた内容に取り組めた</strong><br><span class="small">決めたことをひと通り進められた</span></span></label><input class="choice-input" type="radio" name="challenge" id="challenge-3" value="attempted"><label class="choice-row" for="challenge-3"><span class="choice-mark" aria-hidden="true"></span><span><strong>難しくても決めたことに向き合えた</strong><br><span class="small">うまくいかない部分があっても取り組み続けられた</span></span></label></div></fieldset></div><section class="section" style="margin-top:var(--space-7)" aria-labelledby="trial-title"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4)"><div><h3 id="trial-title">試していること</h3><p style="margin-top:var(--space-2)">いま「朝に<span class="num">15</span>分だけやる」を試しています。</p></div><svg class="fumi fumi-s" viewBox="0 0 32 32" aria-hidden="true" style="flex:0 0 auto"><path d="M6 19c0-6.5 4.5-11 10.5-11 4.5 0 8 3.2 8 7.5 0 5.5-4.5 9.5-10.5 9.5-1.6 0-3.2-.3-4.6-1"/><path d="M24.2 13.5l3.8-1.2-2.8 3"/><circle class="fumi-eye" cx="21.5" cy="13.5" r="1"/><path d="M6.5 20.5L2 24.5M7.5 23L3.5 27"/><path d="M13 25.5v3.5M17.5 25.8v3.2"/><path d="M12 14.5c2.5-1 5.5-1 8 .5"/></svg></div><fieldset style="border:0;padding:0;margin:var(--space-4) 0 0"><legend>今回の学習で試しましたか？（任意）</legend><div class="segments" style="margin-top:var(--space-3)" role="radiogroup" aria-label="試しましたか"><input class="segment-input" type="radio" name="trial" id="trial-yes" value="yes"><label class="segment-label" for="trial-yes">はい</label><input class="segment-input" type="radio" name="trial" id="trial-no" value="no"><label class="segment-label" for="trial-no">いいえ</label></div><p class="caption" style="margin-top:var(--space-2)">未回答のまま保存できます。回答は試行の記録に加わり、「振り返る」でふみが要約します。</p></fieldset></section><div class="button-row" style="margin-top:var(--space-7)"><button class="btn btn-primary" type="submit">評価結果を見る</button></div><p class="small" style="margin-top:var(--space-4)"><a href="./home.html">このセッションを破棄する</a></p></form></section></div></div></main>
<script>(()=>{const form=document.getElementById("evaluation-form");document.querySelectorAll(".choice-input").forEach(input=>input.addEventListener("change",()=>{document.querySelectorAll(`input[name='${input.name}']`).forEach(item=>document.querySelector(`label[for='${item.id}']`).classList.toggle("is-selected",item.checked));document.getElementById(`${input.name}-error`).hidden=true;}));form.addEventListener("submit",event=>{event.preventDefault();let valid=true;["focus","challenge"].forEach(name=>{const selected=form.querySelector(`input[name='${name}']:checked`);const error=document.getElementById(`${name}-error`);error.hidden=Boolean(selected);if(!selected)valid=false;});if(valid)location.href="./result.html";else form.querySelector(".group-error:not([hidden])").scrollIntoView({block:"center"});});})();</script>
</body></html>
