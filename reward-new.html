<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ご褒美を設定</title><link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="stylesheet" href="./components.css"></head><body><div class="app-shell"><nav class="side-nav" aria-label="目次"><a class="brand" href="./index.html">きづき</a><ul class="nav-list"><li><a class="nav-link" href="./home.html">ホーム</a></li><li><a class="nav-link" href="./history.html">履歴</a></li><li><a class="nav-link study" href="./study.html">学習する</a></li><li><a class="nav-link" href="./manual.html">取説</a></li><li><a class="nav-link" href="./settings.html" aria-current="page">設定</a></li></ul></nav><main class="page"><div class="document-grid"><div class="main-column"><h1>ご褒美を設定</h1><form class="section form-stack" style="margin-top:var(--space-5)" action="./reward.html"><div><label class="field-label" for="reward-name">ご褒美名 *</label><input class="field-control" id="reward-name" type="text" maxlength="100" value="友達とビールを飲む" required></div><fieldset style="border:0;padding:0;margin:0"><legend class="field-label">対象Rank</legend><div class="segments"><input class="segment-input" id="rank-c" type="radio" name="rank"><label class="segment-label" for="rank-c">C以上</label><input class="segment-input" id="rank-b" type="radio" name="rank" checked><label class="segment-label" for="rank-b">B以上</label><input class="segment-input" id="rank-a" type="radio" name="rank"><label class="segment-label" for="rank-a">A</label></div></fieldset><fieldset style="border:0;padding:0;margin:0"><legend class="field-label">必要回数</legend><div class="segments"><input class="segment-input" id="count-3" type="radio" name="count"><label class="segment-label" for="count-3">3</label><input class="segment-input" id="count-5" type="radio" name="count" checked><label class="segment-label" for="count-5">5</label><input class="segment-input" id="count-10" type="radio" name="count"><label class="segment-label" for="count-10">10</label><input class="segment-input" id="count-manual" type="radio" name="count"><label class="segment-label" for="count-manual">手動入力</label></div><label class="field-label" for="manual-count" style="margin-top:var(--space-3)">必要回数（1〜30）</label><input class="field-control" id="manual-count" type="number" min="1" max="30" value="5"></fieldset><button class="btn btn-primary" type="submit">ご褒美を設定する</button></form></div></div></main><nav class="mobile-nav" aria-label="目次"><ul class="mobile-nav-list"><li><a class="nav-link" href="./home.html">ホーム</a></li><li><a class="nav-link" href="./history.html">履歴</a></li><li><a class="nav-link study" href="./study.html">学習する</a></li><li><a class="nav-link" href="./manual.html">取説</a></li><li><a class="nav-link" href="./settings.html" aria-current="page">設定</a></li></ul></nav></div></body></html>
