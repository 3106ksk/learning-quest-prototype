<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>パスワード再設定</title><link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="stylesheet" href="./components.css"></head><body>
<header class="public-header"><a class="brand" href="./lp.html">きづき</a><nav class="public-actions" aria-label="公開メニュー"><a class="btn btn-text" href="./login.html">ログイン</a><a class="btn btn-secondary" href="./signup.html">無料で始める</a></nav></header>
<main class="public-page"><div class="form-shell"><h1>パスワード再設定</h1><section class="section" style="margin-top:var(--space-5)" aria-labelledby="request-title"><h2 id="request-title">再設定メールを要求</h2><form class="form-stack" style="margin-top:var(--space-5)"><div><label class="field-label" for="reset-email">メールアドレス</label><input class="field-control" id="reset-email" type="email" autocomplete="email" required></div><button class="btn btn-primary" type="submit">再設定メールを要求</button></form></section><p class="caption" style="margin-block:var(--space-7)">プロトタイプの確認用</p><section class="section" aria-labelledby="new-password-title"><h2 id="new-password-title">新しいパスワードを設定</h2><form class="form-stack" style="margin-top:var(--space-5)" action="./login.html"><div><label class="field-label" for="new-password">新しいパスワード（8文字以上）</label><input class="field-control" id="new-password" type="password" minlength="8" autocomplete="new-password" required></div><div><label class="field-label" for="new-password-confirm">新しいパスワード（確認）</label><input class="field-control" id="new-password-confirm" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary" type="submit">新しいパスワードを設定</button></form></section></div></main></body></html>
