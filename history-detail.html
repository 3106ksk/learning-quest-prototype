<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学習記録の詳細</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./components.css">
</head>
<body>
<div class="app-shell">
  <nav class="side-nav" aria-label="目次">
    <a class="brand" href="./home.html">きづき</a>
    <ul class="nav-list">
      <li><a class="nav-link" href="./home.html">ホーム</a></li>
      <li><a class="nav-link" href="./history.html" aria-current="page">履歴</a></li>
      <li><a class="nav-link study" href="./study.html">学習する</a></li>
      <li><a class="nav-link" href="./manual.html">取説</a></li>
      <li><a class="nav-link" href="#">設定</a></li>
    </ul>
  </nav>

  <main class="page">
    <div class="document-grid">
      <div class="main-column">
        <header class="evaluation-result-header">
          <h1>英単語を10個復習</h1>
        </header>

        <div class="stamp-stage stamp-stage-m">
          <span class="stamp stamp-b stamp-m" role="img" aria-label="Rank B">
            <svg viewBox="0 0 96 96" fill="currentColor" aria-hidden="true" focusable="false">
              <circle class="stamp-ring" cx="48" cy="48" r="45" fill="none" stroke="currentColor" stroke-width="1.5"/>
              <circle class="stamp-ring-inner" cx="48" cy="48" r="42" fill="none" stroke="currentColor" stroke-width="0.75"/>
              <text class="stamp-rank-letter" x="48" y="55" font-size="43" font-weight="600" text-anchor="middle">B</text>
              <text class="stamp-rank-word" x="48" y="71" font-size="7" letter-spacing="1.4" text-anchor="middle">RANK</text>
            </svg>
          </span>
        </div>

        <section class="evaluation-result-section evaluation-session" aria-labelledby="session-title">
          <h2 id="session-title" class="evaluation-result-section-title">今回の学習</h2>
          <dl class="definition-list evaluation-result-list evaluation-session-list">
            <div class="definition-row">
              <dt>開始日時</dt>
              <dd><time datetime="2026-07-04T20:10:00+09:00">7/4 20:10</time></dd>
            </div>
            <div class="definition-row">
              <dt>予定時間</dt>
              <dd class="num">15分</dd>
            </div>
            <div class="definition-row">
              <dt>実時間</dt>
              <dd class="num">13分</dd>
            </div>
          </dl>
        </section>

        <section class="evaluation-result-section" aria-labelledby="effort-title">
          <h2 id="effort-title" class="evaluation-result-section-title">今回の努力の記録</h2>
          <dl class="definition-list evaluation-result-list evaluation-breakdown">
            <div class="definition-row">
              <dt>着手</dt>
              <dd>学習を開始できた</dd>
            </div>
            <div class="definition-row">
              <dt>集中</dt>
              <dd>
                <p><strong>集中して取り組めた</strong></p>
                <p class="small">学習内容に向き合って進められた</p>
              </dd>
            </div>
            <div class="definition-row">
              <dt>チャレンジ</dt>
              <dd>
                <p><strong>自分で決めた内容に取り組めた</strong></p>
                <p class="small">決めたことをひと通り進められた</p>
              </dd>
            </div>
          </dl>
          <p class="small evaluation-result-reason">学習を開始したことに加え、今回記録された集中またはチャレンジの内容からRank Bになりました。</p>
        </section>
      </div>
    </div>
  </main>

  <nav class="mobile-nav" aria-label="目次">
    <ul class="mobile-nav-list">
      <li><a class="nav-link" href="./home.html">ホーム</a></li>
      <li><a class="nav-link" href="./history.html" aria-current="page">履歴</a></li>
      <li><a class="nav-link study" href="./study.html">学習する</a></li>
      <li><a class="nav-link" href="./manual.html">取説</a></li>
      <li><a class="nav-link" href="#">設定</a></li>
    </ul>
  </nav>
</div>
</body>
</html>
